$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Foo",
      "surname": "Bar",
      "birthdate": "1990-01-01",
      "address": "Street name",
      "email": "seminar-2-test-{{$timestamp}}@example.com",
      "password": "1234"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
