$kind: http-request
name: Sign in, missing password -> 400
url: "{{baseUrl}}/api/auth/signin"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "johndoe@example.com"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
