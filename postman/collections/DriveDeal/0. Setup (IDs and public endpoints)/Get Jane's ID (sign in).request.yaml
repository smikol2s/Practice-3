$kind: http-request
url: "{{baseUrl}}/api/auth/signin"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "janesmith@example.com",
      "password": "5678"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('janeId', pm.response.json()._id);
    language: text/javascript
order: 3000
