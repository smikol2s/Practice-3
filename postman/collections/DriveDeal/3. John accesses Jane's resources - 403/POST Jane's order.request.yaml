$kind: http-request
url: "{{baseUrl}}/api/users/{{janeId}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "address": "x",
      "cardHolder": "x",
      "cardNumber": "1"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
